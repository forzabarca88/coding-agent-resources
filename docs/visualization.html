<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Interactive chart of evaluation runs — total context used against turns, coloured by model, read live from data/eval-results.md.">
  <title>Evaluation Chart — Coding Agent Resources</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%232e4a7a' stroke-width='2.5'/%3E%3Cpath d='M16 3v6M16 23v6M3 16h6M23 16h6' stroke='%232e4a7a' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Fragment+Mono:ital@0;1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="assets/content.js" defer></script>
  <script src="assets/site.js" defer></script>
  <script src="assets/visualization.js" defer></script>
</head>
<body data-page="viz">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Coding Agent Resources — index">
        <svg class="brand__mark" width="18" height="18" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <path d="M16 3v6M16 23v6M3 16h6M23 16h6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>Coding Agent Resources</span>
      </a>
      <nav class="site-nav" aria-label="Site pages">
        <a class="site-nav__link" data-page-link="index" href="index.html">Index</a>
        <a class="site-nav__link" data-page-link="results" href="evaluation-results.html">Evaluation results</a>
        <a class="site-nav__link" data-page-link="viz" href="visualization.html">Evaluation Chart</a>
      </nav>
    </header>

    <main id="main">
      <!-- Masthead (prose: content/visualization/masthead.md) -->
      <header class="masthead">
        <p class="eyebrow">Coding Agent Resources · Agent Evaluation</p>
        <h1 class="masthead__title">Evaluation chart</h1>
        <div class="masthead__subhead" data-content="content/visualization/masthead.md"></div>
      </header>

      <!-- Chart (prose: content/visualization/note.md) -->
      <section class="viz" aria-labelledby="viz-heading">
        <h2 id="viz-heading" class="intro__heading">
          <span class="chip">Read</span>
          Reading the chart
        </h2>
        <div class="viz__md" data-content="content/visualization/note.md"></div>

        <!-- Controls -->
        <div class="viz-controls" role="group" aria-label="Chart filters">
          <div class="viz-control viz-control--source">
            <span class="viz-control__label" id="source-label">Source</span>
            <div class="seg" role="group" aria-labelledby="source-label">
              <button type="button" class="seg-btn" data-source="all">All</button>
              <button type="button" class="seg-btn" data-source="Provider">Provider</button>
              <button type="button" class="seg-btn" data-source="Local">Local</button>
            </div>
          </div>
          <label class="viz-control" for="top-filter">
            <span class="viz-control__label">Runs to show</span>
            <select id="top-filter" class="select">
              <option value="25" selected>25 with least context</option>
              <option value="15">15 with least context</option>
              <option value="10">10 with least context</option>
              <option value="all">All runs</option>
            </select>
          </label>
          <div class="viz-control viz-control--models">
            <div class="viz-control__head">
              <span class="viz-control__label" id="models-label">Models</span>
              <span class="legend-actions">
                <button type="button" class="legend-btn" id="models-all">Select all</button>
                <button type="button" class="legend-btn" id="models-none">Clear</button>
              </span>
            </div>
            <div class="model-search-row">
              <input id="model-search" class="model-search" type="search"
                placeholder="wildcard search — *qwen*, openrouter/*, or a note like Q4 — filters the runs"
                aria-label="Filter runs with wildcards * and ?; matches each run's model name or its notes"
                autocomplete="off" spellcheck="false">
              <span id="model-search-count" class="model-search-count" aria-live="polite"></span>
              <button type="button" id="model-search-clear" class="model-search-clear" hidden>Clear search</button>
            </div>
            <div class="model-chips" id="model-chips" role="group" aria-labelledby="models-label"></div>
          </div>
        </div>

        <p id="viz-status" class="results-status" role="status" aria-live="polite">
          Loading data/eval-results.md…
        </p>
        <button id="viz-retry" type="button" class="retry" hidden>Reload results</button>

        <!-- Plot -->
        <div class="viz-plot">
          <div class="viz-chart" id="viz-chart"></div>
          <div id="viz-tooltip" class="viz-tooltip is-hidden" role="tooltip"></div>
        </div>

        <p id="viz-summary" class="viz-summary" aria-live="polite"></p>
      </section>

    </main>

    <footer class="page-footer">
      <p>Coding Agent Resources</p>
      <nav class="page-footer__nav" aria-label="Footer pages">
        <a href="index.html">Index</a>
        <a href="evaluation-results.html">Evaluation results</a>
        <a href="visualization.html">Evaluation Chart</a>
      </nav>
    </footer>
  </div>
</body>
</html>
